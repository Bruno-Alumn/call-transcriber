# Push a tag like v1.2.0 (matching VERSION) to publish a GitHub Release with the
# Windows package attached (on macOS, app/mac/build.sh builds the app from the checkout). The apps' "Update" button installs
# the newest release tag via git.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Tag must match VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - name: Build Windows package
        run: zsh app/windows/make-zip.sh
      - name: Release notes = tag message
        run: git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > notes.md
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "Call Transcriber ${GITHUB_REF_NAME}" --notes-file notes.md \
            dist/CallTranscriber-Windows.zip
