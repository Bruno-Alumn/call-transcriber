[project]
name = "discord-transcriber-server"
version = "0.1.0"
description = "Local transcription server for Call Transcriber (Discord voice calls)"
requires-python = ">=3.12"
dependencies = [
    # Speech engines: MLX on macOS; ONNX Runtime elsewhere (Windows). The NVIDIA
    # (torch/CUDA) engine is installed separately by the Windows installer when
    # an NVIDIA GPU is present.
    "mlx-audio>=0.6.7; sys_platform == 'darwin'",
    "mlx-whisper>=0.4; sys_platform == 'darwin'",
    "onnx-asr[cpu,hub]>=0.12; sys_platform != 'darwin'",
    "numpy>=2.5.5",
    "psutil>=6",
    # Windows app window + tray icon
    "pywebview>=5; sys_platform == 'win32'",
    "pystray>=0.19; sys_platform == 'win32'",
    "pillow>=10; sys_platform == 'win32'",
    "soundfile>=0.14.0",
    "websockets>=17.4",
]

[tool.uv]
package = false   # an app, not a library: nothing to build on install
