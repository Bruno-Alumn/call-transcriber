<!doctype html>
<html><head><meta charset="utf-8"><meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self'">
<title>Share in Discord</title>
<style>
:root { --bg:#f4f4f2; --panel:#fcfcfb; --line:#e3e2de; --text:#0b0b0b; --muted:#85847f; --sel:#2a78d6; }
@media (prefers-color-scheme: dark) { :root { --bg:#111110; --panel:#1a1a19; --line:#2c2c2a; --text:#f0efec; --muted:#8d8c85; --sel:#3987e5; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }
header { padding: 14px 16px 6px; }
h1 { font-size: 14px; margin: 0; font-weight: 600; }
.sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
main { flex: 1; overflow-y: auto; padding: 6px 16px 10px; }
h2 { font-size: 11.5px; font-weight: 600; color: var(--muted); margin: 12px 0 6px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
button.src { font: inherit; color: inherit; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px; cursor: pointer; }
button.src:hover { border-color: var(--muted); }
button.src.on { border-color: var(--sel); outline: 1px solid var(--sel); }
.th { aspect-ratio: 16 / 9; background: var(--bg); border-radius: 3px; display: grid; place-items: center; overflow: hidden; color: var(--muted); font-size: 11px; }
.th img { width: 100%; height: 100%; object-fit: contain; }
.nm { margin-top: 5px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nm small { display: block; color: var(--muted); font-size: 11px; white-space: normal; }
footer { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid var(--line); }
footer button { font: inherit; padding: 6px 14px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
footer button.go { background: var(--sel); border-color: var(--sel); color: #fff; }
footer button:disabled { opacity: .5; cursor: default; }
</style></head>
<body>
<header><h1>Share in Discord</h1><div class="sub">Pick what the call sees.</div></header>
<main id="list"><div class="sub">Loading…</div></main>
<footer><button id="cancel">Cancel</button><button class="go" id="go" disabled>Share</button></footer>
<script src="picker.js"></script>
</body></html>
